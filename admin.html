<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7c2d92"><title>Admin — નવરાત્રી હિસાબ</title><link rel="stylesheet" href="styles.css"></head><body><header class="hero"><div class="container"><div>🔐 Admin Panel</div><h1>નવરાત્રી હિસાબ વ્યવસ્થાપન</h1><a class="admin-link" href="index.html">👥 Public હિસાબ</a></div></header><main class="container"><section id="loginPanel" class="panel auth-box"><h2>Admin Login</h2><input id="email" type="email" placeholder="Email" style="width:100%;margin:6px 0"><input id="password" type="password" placeholder="Password" style="width:100%;margin:6px 0"><button id="loginBtn" class="btn primary">Login</button><div id="loginError" class="error"></div></section><div id="appPanel" class="hidden"><section class="cards"><article class="card income"><span>કુલ આવક</span><strong id="aIncome">₹0</strong></article><article class="card expense"><span>કુલ ખર્ચ</span><strong id="aExpense">₹0</strong></article><article class="card balance"><span>બાકી</span><strong id="aBalance">₹0</strong></article></section><section class="panel"><div class="section-head"><h2>➕ નવી નોંધ</h2><button id="logoutBtn" class="btn">Logout</button></div><div class="tabs"><button class="tab active" data-form="donationForm">📥 ફાળો</button><button class="tab" data-form="expenseForm">📤 ખર્ચ</button><button class="tab" data-form="otherForm">💵 અન્ય આવક</button></div><form id="donationForm"><div class="grid"><label>તારીખ<input id="dDate" type="date" required></label><label>નામ<input id="dName" required></label><label>ગામ / વિગત<input id="dPlace"></label><label>માધ્યમ<select id="dMethod"><option>Cash</option><option>UPI</option><option>Bank</option><option>Other</option></select></label><label>રકમ<input id="dAmount" type="number" min="0" required></label><label>નોંધ<input id="dNote"></label></div><br><button class="btn primary">ફાળો સાચવો</button></form><form id="expenseForm" class="hidden"><div class="grid"><label>તારીખ<input id="eDate" type="date" required></label><label>ખર્ચનું નામ<input id="eName" required></label><label>વિગત<input id="eDetail"></label><label>રકમ<input id="eAmount" type="number" min="0" required></label><label>નોંધ<input id="eNote"></label></div><br><button class="btn primary">ખર્ચ સાચવો</button></form><form id="otherForm" class="hidden"><div class="grid"><label>તારીખ<input id="oDate" type="date" required></label><label>આવકનું નામ<input id="oName" required></label><label>વિગત<input id="oDetail"></label><label>રકમ<input id="oAmount" type="number" min="0" required></label><label>નોંધ<input id="oNote"></label></div><br><button class="btn primary">આવક સાચવો</button></form><div id="saveMsg"></div></section><section class="panel"><h2>⚙️ સેટિંગ</h2><div class="grid"><label>મહોત્સવનું નામ<input id="sName"></label><label>અગાઉના વર્ષથી બાકી<input id="sPrevious" type="number" min="0"></label><label>સંપર્ક<input id="sContact"></label><label>જાહેર નોંધ<input id="sNote"></label></div><br><button id="saveSettings" class="btn primary">સેટિંગ સાચવો</button></section><section class="panel"><h2>📋 રેકોર્ડ</h2><div id="records"></div></section></div></main><script type="module" src="admin.js"></script></body></html>
